name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Chrome loads these straight from the repo root, so a missing one means a broken unpacked install.
      - name: Check the build output the extension loads
        run: ls background.js gate.js options.js popup.js pill.js core.js dom.js messages.js
